<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AP Physics 1 learning site" />
    <title>Small Steps Physics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />

    <script defer src="./js/data/unit1.js"></script>
    <script defer src="./js/data/unit2.js"></script>
    <script defer src="./js/data/unit3.js"></script>
    <script defer src="./js/data/unit4.js"></script>
    <script defer src="./js/data/unit5.js"></script>
    <script defer src="./js/data/unit6.js"></script>
    <script defer src="./js/data/unit7.js"></script>
    <script defer src="./js/data/unit8.js"></script>

    <script defer src="./js/ui/howto.js"></script>
    <script defer src="./js/ui/lessons.js"></script>
    <script defer src="./js/ui/practice.js"></script>
    <script defer src="./js/ui/quiz.js"></script>
    <script defer src="./js/ui/test.js"></script>
    <script defer src="./js/ui/flashcards.js"></script>
    <script defer src="./js/ui/dashboard.js"></script>
    <script defer src="./js/ui/fbd-tool.js"></script>
    <script defer src="./js/ui/sims.js"></script>

    <script defer src="./js/router.js"></script>
    <script defer src="./js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-action="nav-home">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span class="brand-copy">
            <strong>Small Steps Physics</strong>
            <small>AP Physics 1 / Full Course</small>
          </span>
        </button>

        <div class="topbar-actions">
          <button class="back-button" type="button" data-action="go-back" aria-label="Previous">Previous</button>
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
          <button class="icon-button" type="button" data-action="toggle-settings">⚙</button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>
    </div>

    <aside class="settings-panel" id="settings-panel" aria-hidden="true">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="icon-button" type="button" data-action="close-settings" aria-label="Close settings">✕</button>
      </div>

      <div class="settings-group">
        <div class="toggle-row">
          <span>Light / Dark</span>
          <button class="switch-button" type="button" data-action="toggle-theme">Dark mode</button>
        </div>

        <div class="toggle-row">
          <span>Gravity</span>
          <select data-setting="gravity" aria-label="Gravity setting">
            <option value="9.8">9.8 m/s²</option>
            <option value="10">10 m/s²</option>
          </select>
        </div>

        <div class="toggle-row">
          <span>Timer</span>
          <button class="switch-button" type="button" data-action="toggle-timer">Off</button>
        </div>

        <div class="toggle-row">
          <span>Unlock all topics</span>
          <button class="switch-button" type="button" data-action="toggle-unlock">Off</button>
        </div>
      </div>

      <div class="settings-actions">
        <button class="secondary-button" type="button" data-action="export-progress">Export progress</button>
        <label class="secondary-button file-button">
          Import progress
          <input type="file" accept="application/json" data-action="import-progress" />
        </label>
        <button class="danger-button" type="button" data-action="reset-progress">Reset progress</button>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
